server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API REST: /api/... -> backend (sin el prefijo /api)
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket (Socket.IO) -> backend, con headers de upgrade
  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  # Dashboard de Munin protegido con basic auth (admin:admin por defecto).
  # Munin emite HTML con paths absolutos -> reescribimos con sub_filter.
  location /munin/ {
    auth_basic           "Monitoreo HealthSync";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_pass http://munin:8080/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    sub_filter_once off;
    sub_filter_types  text/html text/css application/javascript;
    sub_filter 'href="/' 'href="/munin/';
    sub_filter 'src="/'  'src="/munin/';
  }

  # SPA fallback: cualquier ruta no encontrada devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
