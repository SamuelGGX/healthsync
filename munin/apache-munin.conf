<VirtualHost *:8081>
    ServerName healthsync-munin

    DocumentRoot /var/cache/munin/www
    Alias /munin/ /var/cache/munin/www/
    RedirectMatch 302 ^/$ /munin/

    <Directory /var/cache/munin/www/>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Expose lightweight JSON API for frontend at /munin-api/munin-summary.py
    ScriptAlias /munin-api/ /usr/lib/cgi-bin/
    <Directory "/usr/lib/cgi-bin/">
        Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/healthsync-munin-error.log
    CustomLog ${APACHE_LOG_DIR}/healthsync-munin-access.log combined
</VirtualHost>