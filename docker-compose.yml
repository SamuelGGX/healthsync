services:
  db:
    image: timescale/timescaledb:latest-pg16
    command: >
      postgres
      -c shared_preload_libraries=timescaledb,pg_stat_statements
      -c pg_stat_statements.track=all
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - healthsync-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - healthsync-net
    restart: unless-stopped

  simulator:
    build: ./simulator
    env_file: .env
    environment:
      BACKEND_URL: http://backend:${BACKEND_PORT}
    depends_on:
      - backend
    networks:
      - healthsync-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - munin
    networks:
      - healthsync-net
    restart: unless-stopped

  munin:
    build: ./munin
    depends_on:
      - backend
    networks:
      - healthsync-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/munin/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - munin-db:/var/lib/munin
      - munin-cache:/var/cache/munin
      - munin-log:/var/log/munin

volumes:
  pgdata:
  munin-db:
  munin-cache:
  munin-log:

networks:
  healthsync-net:
    driver: bridge
